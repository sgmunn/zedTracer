id = "kusto"
name = "Kusto"
description = "Kusto Query Language highlighting, completion, hover, and syntax diagnostics."
version = "0.1.0"
schema_version = 1
authors = ["zedTracer contributors"]
repository = "https://github.com/Willem-J-an/tree-sitter-kusto"

[grammars.kusto]
repository = "https://github.com/Willem-J-an/tree-sitter-kusto"
commit = "8353a1296607d6ba33db7c7e312226e5fc83e8ce"

[language_servers.kusto-lsp]
name = "Kusto Language Server"
# YAML is listed for the parameter profile files, which get a `Make Active` lens. The server leaves
# every other YAML file alone.
languages = ["Kusto", "YAML"]

[language_servers.kusto-lsp.language_ids]
Kusto = "kusto"
YAML = "yaml"
